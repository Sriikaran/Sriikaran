<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 173"
     width="760" height="173" role="img" aria-labelledby="title description">
  <title id="title">Repository languages</title>
  <desc id="description">Python 46%, JavaScript 25%, TypeScript 21%, HTML 4%, Rust 4%</desc>
  <rect x="0.5" y="0.5" width="759" height="172" rx="8" fill="#151d2a" stroke="#344459"/>
  <g font-family="ui-monospace, Consolas, monospace">
