    <text x="740" y="62" fill="#abbad0" font-size="14" font-weight="400" text-anchor="end">46%</text>
    <text x="20" y="85" fill="#eef5ff" font-size="15" font-weight="600" text-anchor="start">JavaScript</text>
    <rect x="170" y="75" width="516" height="10" rx="5" fill="#233043" stroke="none"/>
