name: Refresh profile cards

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-cards.yml'
      - '.github/scripts/generate_profile_cards.py'

permissions:
  contents: write

concurrency:
  group: profile-cards

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PROFILE_LOGIN: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate cards from GitHub data
        run: python3 .github/scripts/generate_profile_cards.py "$PROFILE_LOGIN"
      - name: Commit refreshed cards
        run: |
          git add -- assets/profile-stats.svg assets/profile-languages.svg assets/profile-activity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh GitHub profile cards'
          git push
